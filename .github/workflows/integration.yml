name: Real server smoke tests

on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: NiFi ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version:
          - 2.1.0
          - 2.2.0
          - 2.3.0
          - 2.4.0
          - 2.5.0
          - 2.6.0
          - 2.7.0
          - 2.7.1
          - 2.7.2
          - 2.8.0
          - 2.9.0
          - 2.10.0
          - 2.11.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: nifi-${{ matrix.version }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: go.sum
      - run: ./scripts/integration-smoke.sh "${{ matrix.version }}"

