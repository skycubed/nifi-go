name: Discover upstream NiFi releases

on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
      - name: Open a notification for an untracked stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(jq -r .version source.lock.json)
          latest=$(git ls-remote --tags https://github.com/apache/nifi.git 'refs/tags/rel/nifi-2.*' \
            | sed -E 's#.*refs/tags/rel/nifi-##' \
            | grep -E '^2\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)
          if [ -z "$latest" ] || [ "$latest" = "$current" ] || git ls-remote --exit-code --heads origin "nifi-$latest" >/dev/null 2>&1; then
            exit 0
          fi
          title="Apache NiFi $latest bindings"
          if gh issue list --state all --search "in:title $title" --json title --jq '.[].title' | grep -Fxq "$title"; then
            exit 0
          fi
          gh issue create --title "$title" \
            --body "Apache NiFi $latest is available. Run the release workflow in prepare mode after verifying the upstream announcement. This workflow never publishes automatically."

