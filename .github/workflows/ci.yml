name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "nifi-*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: Locked specifications and generated code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/artifacts
          key: nifi-openapi-${{ hashFiles('source.lock.json') }}
      - run: make verify-generated

  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make test
      - run: make test-race
      - run: make vet

  quality:
    name: Formatting, static analysis, and vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l $(find . -name '*.go' -not -path './.cache/*'))
          test -z "$files" || { printf '%s\n' "$files"; exit 1; }
      - run: make lint
      - run: make vuln
